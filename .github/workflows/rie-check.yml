# rie check on this repo's own PRs: the action at the repo root, run against itself.
name: rie check

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  rie-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: ./
        with:
          tsconfig: tsconfig.json
